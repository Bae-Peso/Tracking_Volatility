# HTTP 포트(compose의 WEB_PORT, 기본 8080) → web 서비스(gunicorn :8000).
# 나중에 외부에 공개하면 여기에 HTTPS와 인증(auth_basic 등)을 붙인다.
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # web 컨테이너를 다시 만들면 IP가 바뀐다. 시작할 때 한 번만 찾으면 이전 IP로 보내 502가 나므로,
    # Docker 내장 DNS로 10초마다 다시 찾는다 (proxy_pass에 변수를 써야 요청 때마다 찾음).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
