# docker compose up -d --build                   수집 + 웹 시작 (재부팅 후 자동 재시작)
# docker compose logs -f collector               수집 로그 (web, nginx 도 같은 방식)
# docker compose run --rm collector setup        설치 TUI (도시 추가·등록 취소)
# docker compose run --rm collector city list    그 밖의 명령 (collect --force, recompute …)
# 웹 조회: http://<이 PC 주소>:8080  (포트는 .env 의 WEB_PORT)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 매 :00/:30에 현지 22시가 지난 도시를 받아 data/ 에 쓴다
  collector:
    build: .
    image: accu-weather:latest
    restart: unless-stopped
    # data/ 에 쓰는 사용자 = 호스트 사용자. 기본 1000, 다르면 .env에 UID=, GID= (README "2. 데이터 폴더와 사용자 ID")
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      WEB_PORT: "${WEB_PORT:-8080}"                             # 설치 TUI가 웹 주소를 안내할 때만 씀
    volumes:
      - ./data:/app/data                                        # DB (호스트의 data/ 그대로)
      - ./config.toml:/app/config.toml:ro                       # 고친 뒤 재시작하면 반영
      - ./weather_code.json:/app/weather_code.json:ro
      - ./weather_severity.json:/app/weather_severity.json:ro
    logging: *logging

  # 웹 조회 (Flask + gunicorn). DB는 읽기 전용으로만 연다
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: accu-weather-web:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data:ro
      - ./config.toml:/app/config.toml:ro
      - ./weather_code.json:/app/weather_code.json:ro
      - ./weather_severity.json:/app/weather_severity.json:ro
    logging: *logging

  # HTTP 포트를 받아 web 으로 넘긴다. 외부 공개 시 HTTPS·인증은 여기에 (web/nginx.conf)
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *logging
